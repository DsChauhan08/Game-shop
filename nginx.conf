# Nginx Configuration for Game Shop
# Add this to your nginx.conf or site-specific config file

# Main server block
server {
    listen 80;
    server_name your-domain.com;
    root /path/to/Game-shop;
    index index.html;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets for 1 year
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Cache CSS and JS for 1 month
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Cache fonts for 1 year
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Service Worker - No cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    
    # Manifest - Short cache
    location = /manifest.json {
        add_header Cache-Control "max-age=3600";
        expires 1h;
    }
    
    # HTML files - Short cache with revalidation
    location ~* \.html$ {
        add_header Cache-Control "max-age=3600, public, must-revalidate";
        expires 1h;
    }
    
    # Disable logging for favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # Disable logging for robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}

# HTTPS Configuration (recommended for production and PWA)
# SSL is required for Service Workers in production
server {
    listen 443 ssl http2;
    server_name your-domain.com;
    root /path/to/Game-shop;
    index index.html;
    
    # SSL certificates (use Let's Encrypt)
    ssl_certificate /path/to/ssl/fullchain.pem;
    ssl_certificate_key /path/to/ssl/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # HTTP/2 Push for critical resources (optional but beneficial)
    http2_push /styles.css;
    http2_push /script.js;
    
    # ... (rest of the configuration same as HTTP block above)
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets for 1 year
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Cache CSS and JS for 1 month
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Cache fonts for 1 year
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Service Worker - No cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    
    # Manifest - Short cache
    location = /manifest.json {
        add_header Cache-Control "max-age=3600";
        expires 1h;
    }
    
    # HTML files - Short cache with revalidation
    location ~* \.html$ {
        add_header Cache-Control "max-age=3600, public, must-revalidate";
        expires 1h;
    }
}

# Redirect HTTP to HTTPS (for production)
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}
